<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Pitch Booking System</title>
    
    <script src="firebase-config.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height:100vh;
            padding:10px;
        }
        .container { max-width:1400px; margin:0 auto; background:white; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,0.1); overflow:hidden; }
        
        /* Responsive Header */
        .header { 
            background:linear-gradient(135deg, #2c3e50, #34495e); 
            color:white; 
            padding:20px; 
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            text-align: center;
        }
        .header-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; width: 100%; }
        .header h1 { font-size: 1.8em; }
        .header-btn { 
            background:rgba(255,255,255,0.2); border:2px solid rgba(255,255,255,0.3); color:white; 
            padding:10px 18px; border-radius:25px; cursor:pointer; font-size:13px; font-weight:600;
        }
        .signout-btn { background:#dc3545; border: none; }
        .report-btn { background: #28a745 !important; border: none; }

        /* Tabs */
        .tabs { display:flex; background:#f8f9fa; border-bottom:3px solid #e9ecef; overflow-x: auto; }
        .tab { flex:1; padding:15px; text-align:center; background:#e9ecef; cursor:pointer; font-weight:bold; min-width: 100px; }
        .tab.active { background:white; color:#2c3e50; }
        
        .content { padding:15px; }
        .booking-form, .filter-bar { background:#f8f9fa; padding:20px; border-radius:15px; margin-bottom:20px; }
        .form-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:15px; margin-bottom:15px; }
        .form-group { display:flex; flex-direction:column; }
        .form-group label { font-weight:600; margin-bottom:6px; font-size: 14px; }
        .form-group input, .form-group select { padding:12px; border:2px solid #e9ecef; border-radius:10px; }

        /* Tables */
        .table-container { width: 100%; overflow-x: auto; border-radius: 15px; }
        .booking-table table { width:100%; border-collapse:collapse; min-width: 900px; }
        .booking-table th { background:#34495e; color:white; padding:12px; font-size: 14px; text-align: left; }
        .booking-table td { padding:10px; border-bottom:1px solid #eee; font-size: 13px; }

        /* Dashboard */
        .dashboard-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:15px; }
        .dashboard-card { background:#f9f9f9; padding:15px; border-radius:15px; border: 1px solid #eee; }
        .metric { background:#667eea; color:white; border-radius:10px; padding:15px; text-align:center; }
        .metric-value { font-size:1.5em; font-weight:bold; }
        
        /* Calendar */
        #calendarGrid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
        #calendarGrid div { background:#fff; border:1px solid #ddd; border-radius:8px; padding:4px; min-height:60px; font-size: 11px; }

        /* Login */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; z-index: 5000; padding: 15px; }
        .login-box { background: white; padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; }
        .btn { padding:12px 20px; background:linear-gradient(135deg, #667eea, #764ba2); color:white; border:none; border-radius:25px; cursor:pointer; font-weight:600; width: 100%; }
        
        @media (min-width: 768px) {
            body { padding: 20px; }
            .header { flex-direction: row; justify-content: space-between; text-align: left; padding: 30px; }
            .header-controls { width: auto; }
            .header h1 { font-size: 2.2em; }
            .content { padding: 30px; }
        }

        #bookingDetailsPanel { position:fixed; top:0; right:0; width:100%; max-width:350px; height:100%; background:white; box-shadow:-5px 0 15px rgba(0,0,0,0.2); padding:20px; overflow-y:auto; z-index:3000; display:none; }
        #report-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 4000; padding: 15px; }
        .modal-box { background: white; padding: 25px; border-radius: 20px; width: 100%; max-width: 450px; }
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="login-box">
            <h2>⚽ Login</h2>
            <p style="color:#777; margin-bottom:20px;">EP Sports Booking System</p>
            <div class="form-group" style="text-align:left;"><label>Username</label><input id="username" type="text"></div>
            <div class="form-group" style="text-align:left; margin-top:15px;"><label>Password</label><input id="password" type="password"></div>
            <div style="margin: 15px 0; display: flex; align-items: center; gap: 8px;"><input type="checkbox" id="keepLoggedIn"><label for="keepLoggedIn">Keep me logged in</label></div>
            <button id="loginButton" class="btn">Login</button>
            <p id="login-error" style="color:#dc3545; display:none; margin-top:10px;">Invalid credentials.</p>
        </div>
    </div>

    <div id="report-modal-overlay">
        <div class="modal-box">
            <h2 style="text-align:center; margin-bottom:15px;">📄 AI Performance Report</h2>
            <div class="form-group"><label>Select Year</label><select id="reportYearSelect"></select></div>
            <div class="form-row" style="margin-top:10px;">
                <div class="form-group"><label>From</label><select id="reportStartMonth"></select></div>
                <div class="form-group"><label>To</label><select id="reportEndMonth"></select></div>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button id="generateFinalReport" class="btn" style="background: #28a745;">Download PDF</button>
                <button id="closeReportModal" class="btn" style="background: #6c757d;">Cancel</button>
            </div>
        </div>
    </div>

    <div id="app-wrapper" style="display:none;">
        <div class="container">
            <div class="header">
                <div><h1>⚽ Pitch Booking</h1><p>Manage bookings and track revenue</p></div>
                <div class="header-controls">
                    <button id="reportButton" class="header-btn report-btn">📄 AI Report</button>
                    <button id="importButton" class="header-btn">📥 Import</button>
                    <button id="exportButton" class="header-btn">📊 Export</button>
                    <button id="signOutButton" class="header-btn signout-btn">Sign Out</button>
                </div>
            </div>

            <div class="tabs">
                <div class="tab active" data-tab="bookings">📋 Bookings</div>
                <div class="tab" data-tab="dashboard">📊 Dashboard</div>
                <div class="tab" data-tab="calendar">📅 Calendar</div>
            </div>

            <div class="content">
                <div id="bookings-content" class="tab-content">
                    <form id="bookingForm" class="booking-form">
                        <h3>New Booking</h3>
                        <div class="form-row">
                            <div class="form-group"><label>Pitch *</label>
                                <select id="pitch">
                                    <option value="">Select</option>
                                    <option>Fifa Pitch</option>
                                    <option>Junior Football Pitch</option>
                                    <option>Airdome</option>
                                    <option>Half Pitch</option>
                                </select>
                            </div>
                            <div class="form-group"><label>Client *</label><input id="clientName"></div>
                            <div class="form-group"><label>Contact *</label><input id="contact"></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label>Date *</label><input type="date" id="bookingDate"></div>
                            <div class="form-group"><label>Start *</label><input type="time" id="startTime"></div>
                            <div class="form-group"><label>End *</label><input type="time" id="endTime"></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label>Price/hr *</label><input type="number" id="pricePerHour"></div>
                            <div class="form-group"><label>Recurring</label><select id="recurringType"><option value="none">None</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select></div>
                            <div class="form-group" id="recurring-options" style="display:none;"><label>Repetitions</label><input type="number" id="recurringCount" min="1" value="4"></div>
                        </div>
                        <button id="addBookingButton" class="btn" type="button">Add Booking(s)</button>
                    </form>

                    <div class="filter-bar">
                        <div class="form-row">
                            <div class="form-group"><label>Client Name</label><input type="text" id="filterClientName"></div>
                            <div class="form-group"><label>Pitch</label><select id="filterPitch"></select></div>
                            <div class="form-group"><label>Month</label><select id="filterMonth"></select></div>
                            <div class="form-group"><label>Year</label><select id="filterYear"></select></div>
                        </div>
                    </div>

                    <div class="table-container"><div class="booking-table"><table><thead><tr><th>Pitch</th><th>Client</th><th>Date</th><th>Start</th><th>End</th><th>Total</th><th>Action</th></tr></thead><tbody id="bookingsTableBody"></tbody></table></div></div>
                </div>

                <div id="dashboard-content" class="tab-content" style="display:none;">
                    <div class="dashboard-grid">
                        <div class="dashboard-card"><div class="card-title">Total Revenue</div><div class="metric"><div id="totalRevenue" class="metric-value">AED 0.00</div></div></div>
                        <div class="dashboard-card"><div class="card-title">This Month</div><div class="metric"><div id="monthlyRevenue" class="metric-value">AED 0.00</div></div></div>
                        <div class="dashboard-card" style="grid-column: 1 / -1; height: 350px;"><canvas id="monthlyRevenueChart"></canvas></div>
                    </div>
                </div>

                <div id="calendar-content" class="tab-content" style="display:none;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;"><button id="prevMonthBtn" class="btn" style="width:auto;">⬅</button><h2 id="calendarMonth"></h2><button id="nextMonthBtn" class="btn" style="width:auto;">➡</button></div>
                    <div id="calendarGrid"></div>
                </div>
            </div>
        </div>
        <div id="bookingDetailsPanel"><button id="detailsCloseBtn" class="btn" style="background:#dc3545; margin-bottom: 20px;">✖ Close</button><div id="bookingDetailsContent"></div></div>
    </div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    let firestore;
    const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    let monthlyRevenueChart;

    try {
        if (typeof firebase !== 'undefined' && typeof firebaseConfig !== 'undefined') {
            firebase.initializeApp(firebaseConfig);
            firestore = firebase.firestore();
        }
    } catch (e) { console.error("Firebase init failed", e); }

    class FirebaseDB {
        constructor() { this.coll = firestore.collection("bookings"); }
        async getAll() { 
            const snap = await this.coll.orderBy("date").get(); 
            return snap.docs.map(d => ({id: d.id, ...d.data()})); 
        }
        async add(data) {
            const h = (new Date(`1970-01-01T${data.endTime}`) - new Date(`1970-01-01T${data.startTime}`)) / 3600000;
            return await this.coll.add({...data, hours: h, totalPayment: h * data.pricePerHour});
        }
        async delete(id) { await this.coll.doc(id).delete(); }
    }
    const db = new FirebaseDB();

    function handleLogin() {
        const u = document.getElementById('username').value, p = document.getElementById('password').value;
        if (u === "EPsports2025" && p === "EPsport@25") {
            localStorage.setItem('isLoggedIn', 'true');
            showApp();
        } else { document.getElementById('login-error').style.display = 'block'; }
    }

    async function showApp() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-wrapper').style.display = 'block';
        setupFilters(); displayBookings(); updateDashboard();
    }

    async function displayBookings() {
        const bookings = await db.getAll();
        const clientF = document.getElementById('filterClientName').value.toLowerCase();
        const filtered = bookings.filter(b => b.clientName.toLowerCase().includes(clientF));
        document.getElementById('bookingsTableBody').innerHTML = filtered.map(b => `<tr><td>${b.pitch}</td><td>${b.clientName}</td><td>${b.date}</td><td>${b.startTime}</td><td>${b.endTime}</td><td>${b.totalPayment.toFixed(2)}</td><td><button class="btn" style="background:#dc3545; padding:5px 10px;" onclick="deleteBooking('${b.id}')">Del</button></td></tr>`).join('');
    }

    window.deleteBooking = async (id) => { if(confirm("Delete?")) { await db.delete(id); displayBookings(); updateDashboard(); }};

    async function updateDashboard() {
        const bookings = await db.getAll();
        const total = bookings.reduce((s, b) => s + b.totalPayment, 0);
        document.getElementById('totalRevenue').textContent = `AED ${total.toFixed(2)}`;
        
        const ctx = document.getElementById('monthlyRevenueChart').getContext('2d');
        const data = Array(12).fill(0);
        bookings.forEach(b => { data[new Date(b.date).getMonth()] += b.totalPayment; });
        if (monthlyRevenueChart) monthlyRevenueChart.destroy();
        monthlyRevenueChart = new Chart(ctx, { type: 'bar', data: { labels: monthNames.map(m=>m.slice(0,3)), datasets: [{ label: 'Revenue', data: data, backgroundColor: '#667eea' }] }});
    }

    function setupFilters() {
        const yearF = document.getElementById('filterYear');
        const currentYear = new Date().getFullYear();
        for(let i=0; i<3; i++) yearF.innerHTML += `<option value="${currentYear-i}">${currentYear-i}</option>`;
        const monthF = document.getElementById('filterMonth');
        monthNames.forEach((m, i) => monthF.innerHTML += `<option value="${i}">${m}</option>`);
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(tab + '-content').style.display = 'block';
        document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
        if(tab === 'calendar') calendar.render();
    }

    const calendar = {
        current: new Date(),
        async render() {
            const grid = document.getElementById('calendarGrid'); grid.innerHTML = '';
            const month = this.current.getMonth(), year = this.current.getFullYear();
            document.getElementById('calendarMonth').textContent = `${monthNames[month]} ${year}`;
            const bookings = await db.getAll();
            for(let d=1; d<=new Date(year, month+1, 0).getDate(); d++) {
                const cell = document.createElement('div'); cell.innerHTML = `<b>${d}</b>`;
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                bookings.filter(b => b.date === dateStr).forEach(b => {
                    const div = document.createElement('div'); div.style.background = '#667eea'; div.style.color = 'white'; div.style.fontSize = '9px'; div.textContent = b.clientName;
                    cell.appendChild(div);
                });
                grid.appendChild(cell);
            }
        }
    };

    document.getElementById('loginButton').onclick = handleLogin;
    document.getElementById('addBookingButton').onclick = async () => {
        const data = {
            pitch: document.getElementById('pitch').value, clientName: document.getElementById('clientName').value,
            contact: document.getElementById('contact').value, date: document.getElementById('bookingDate').value,
            startTime: document.getElementById('startTime').value, endTime: document.getElementById('endTime').value,
            pricePerHour: parseFloat(document.getElementById('pricePerHour').value)
        };
        await db.add(data); displayBookings(); updateDashboard();
    };
    document.querySelectorAll('.tab').forEach(t => t.onclick = () => switchTab(t.dataset.tab));
    document.getElementById('filterClientName').oninput = displayBookings;
    document.getElementById('prevMonthBtn').onclick = () => { calendar.current.setMonth(calendar.current.getMonth()-1); calendar.render(); };
    document.getElementById('nextMonthBtn').onclick = () => { calendar.current.setMonth(calendar.current.getMonth()+1); calendar.render(); };
    document.getElementById('signOutButton').onclick = () => { localStorage.removeItem('isLoggedIn'); location.reload(); };
    
    if (localStorage.getItem('isLoggedIn') === 'true') showApp();
});
</script>
</body>
</html>
