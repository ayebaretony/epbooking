<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Pitch Booking System</title>
    
    <script src="firebase-config.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height:100vh;
            padding:20px;
        }
        .container { max-width:1400px; margin:0 auto; background:white; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,0.1); overflow:hidden; }
        .header { background:linear-gradient(135deg, #2c3e50, #34495e); color:white; padding:30px; text-align:center; position:relative; }
        .header h1 { font-size:2.5em; margin-bottom:10px; }
        .header-btn { background:rgba(255,255,255,0.2); border:2px solid rgba(255,255,255,0.3); color:white; padding:10px 20px; border-radius:25px; cursor:pointer; font-size:14px; font-weight:600; margin: 0 5px; }
        .export-btn { position:absolute; top:20px; right:20px; }
        .import-btn { position:absolute; top:20px; right:150px; }
        .report-btn { position:absolute; top:70px; right:20px; background: #28a745 !important; }
        .signout-btn { position:absolute; top:20px; left:20px; background:#dc3545; }
        .tabs { display:flex; background:#f8f9fa; border-bottom:3px solid #e9ecef; }
        .tab { flex:1; padding:20px; text-align:center; background:#e9ecef; cursor:pointer; font-weight:bold; }
        .tab.active { background:white; color:#2c3e50; }
        .content { padding:30px; }
        .booking-form, .filter-bar { background:#f8f9fa; padding:20px; border-radius:15px; margin-bottom:30px; border: 1px solid #eee; }
        .form-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:20px; margin-bottom:20px; }
        .form-group { display:flex; flex-direction:column; }
        .form-group label { font-weight:600; margin-bottom:8px; }
        .form-group input, .form-group select { padding:12px; border:2px solid #e9ecef; border-radius:10px; }
        .calculated-field { background:#eee !important; font-weight:600; }
        .btn { padding:12px 20px; background:linear-gradient(135deg, #667eea, #764ba2); color:white; border:none; border-radius:25px; cursor:pointer; font-weight:600; }
        .booking-table { margin-top:20px; border-radius:15px; overflow-x:auto; }
        table { width:100%; border-collapse:collapse; background: white; }
        th { background:#34495e; color:white; padding:15px; text-align: left; }
        td { padding:12px; border-bottom:1px solid #eee; }
        .delete-btn { background:#dc3545; color:white; border:none; padding:8px 12px; border-radius:20px; cursor:pointer; }
        .dashboard-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:20px; }
        .dashboard-card { background:#fff; padding:20px; border-radius:15px; border: 1px solid #eee; }
        .metric { background:#667eea; color:white; border-radius:10px; padding:20px; text-align:center; margin-top: 10px; }
        .metric-value { font-size:2em; font-weight:bold; }
        #calendarGrid { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; background: #eee; padding: 10px; border-radius: 15px; }
        #calendarGrid div { background:#fff; border-radius:10px; padding:10px; min-height:100px; }
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: none; align-items: center; justify-content: center; z-index: 5000; }
        .login-box { background: white; padding: 40px; border-radius: 20px; width: 400px; text-align: center; }
        #report-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 6000; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>⚽ Palace Sports</h2>
            <div class="form-group" style="margin-top:20px; text-align: left;"><label>Username</label><input id="username" type="text"></div>
            <div class="form-group" style="margin-top:15px; text-align: left;"><label>Password</label><input id="password" type="password"></div>
            <button id="loginButton" class="btn" style="width:100%; margin-top:25px;">Login</button>
            <p id="login-error" style="color:#dc3545; display:none; margin-top:15px;">Invalid Credentials</p>
        </div>
    </div>

    <div id="report-modal-overlay">
        <div class="modal-box" style="background:white; padding:40px; border-radius:20px; width: 450px;">
            <h2 style="text-align:center; margin-bottom:20px;">📄 AI Performance Report</h2>
            <div class="form-group"><label>Select Year</label><select id="reportYearSelect"></select></div>
            <div class="form-row" style="margin-top:15px;">
                <div class="form-group"><label>From</label><select id="reportStartMonth"></select></div>
                <div class="form-group"><label>To</label><select id="reportEndMonth"></select></div>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 25px;">
                <button id="generateFinalReport" class="btn" style="flex:1; background: #28a745;">Download PDF</button>
                <button id="closeReportModal" class="btn" style="flex:1; background: #6c757d;">Cancel</button>
            </div>
        </div>
    </div>

    <div id="app-wrapper" style="display:none;">
        <div class="container">
            <div class="header">
                <button id="signOutButton" class="header-btn signout-btn">Sign Out</button>
                <h1>⚽ Football Pitch Booking System</h1>
                <input type="file" id="importFile" style="display:none;" accept=".xlsx, .xls">
                <button id="importButton" class="header-btn import-btn">📥 Import</button>
                <button id="exportButton" class="header-btn export-btn">📊 Export</button>
                <button id="reportButton" class="header-btn report-btn">📄 AI Report</button>
            </div>

            <div class="tabs">
                <div class="tab active" data-tab="bookings">📋 Bookings</div>
                <div class="tab" data-tab="dashboard">📊 Dashboard</div>
                <div class="tab" data-tab="calendar">📅 Calendar</div>
            </div>

            <div class="content">
                <div id="bookings-content" class="tab-content">
                    <form id="bookingForm" class="booking-form">
                        <div class="form-row">
                            <div class="form-group"><label>Pitch *</label>
                                <select id="pitch">
                                    <option value="">Select Pitch</option>
                                    <option>Fifa Pitch</option>
                                    <option>Junior Football Pitch</option>
                                    <option>Airdome</option>
                                    <option>Half Pitch</option>
                                </select>
                            </div>
                            <div class="form-group"><label>Client *</label><input id="clientName"></div>
                            <div class="form-group"><label>Contact *</label><input id="contact"></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label>Date *</label><input type="date" id="bookingDate"></div>
                            <div class="form-group"><label>Start *</label><input type="time" id="startTime"></div>
                            <div class="form-group"><label>End *</label><input type="time" id="endTime"></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label>Price/hr (AED)</label><input type="number" id="pricePerHour"></div>
                            <div class="form-group"><label>Total Hours</label><input id="totalHours" class="calculated-field" readonly></div>
                            <div class="form-group"><label>Total Payment (AED)</label><input id="totalPayment" class="calculated-field" readonly></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Recurring</label>
                                <select id="recurringType">
                                    <option value="none">None</option>
                                    <option value="weekly">Weekly</option>
                                    <option value="monthly">Monthly</option>
                                </select>
                            </div>
                            <div class="form-group" id="recurring-options" style="display:none;">
                                <label>How many times?</label>
                                <input type="number" id="recurringCount" min="1" value="4">
                            </div>
                        </div>
                        <button id="addBookingButton" class="btn" type="button">Add Booking</button>
                    </form>

                    <div class="filter-bar">
                        <div class="form-row">
                            <div class="form-group"><label>Client Name</label><input type="text" id="filterClientName"></div>
                            <div class="form-group"><label>Pitch</label><select id="filterPitch"></select></div>
                            <div class="form-group"><label>Month</label><select id="filterMonth"></select></div>
                            <div class="form-group"><label>Year</label><select id="filterYear"></select></div>
                        </div>
                    </div>

                    <div class="booking-table">
                        <table>
                            <thead><tr><th>Pitch</th><th>Client</th><th>Date</th><th>Start</th><th>End</th><th>Hours</th><th>Rate</th><th>Total</th><th>Action</th></tr></thead>
                            <tbody id="bookingsTableBody"></tbody>
                        </table>
                    </div>
                </div>

                <div id="dashboard-content" class="tab-content" style="display:none;">
                    <div class="dashboard-grid">
                        <div class="dashboard-card"><strong>Total Revenue</strong><div class="metric"><div id="totalRevenue" class="metric-value">AED 0</div></div></div>
                        <div class="dashboard-card"><strong>Monthly Revenue</strong><div class="metric"><div id="monthlyRevenue" class="metric-value">AED 0</div></div></div>
                        <div class="dashboard-card"><strong>Total Bookings</strong><div class="metric"><div id="totalBookingsCount" class="metric-value">0</div></div></div>
                        <div class="dashboard-card" style="grid-column: 1 / -1; height: 400px;">
                            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                                <strong>Revenue Trend</strong>
                                <select id="yearFilter"></select>
                            </div>
                            <canvas id="monthlyRevenueChart"></canvas>
                        </div>
                    </div>
                </div>

                <div id="calendar-content" class="tab-content" style="display:none;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:20px; align-items:center;">
                        <button id="prevMonthBtn" class="btn">⬅ Prev</button>
                        <h2 id="calendarMonth"></h2>
                        <button id="nextMonthBtn" class="btn">Next ➡</button>
                        <button id="todayBtn" class="btn">Today</button>
                    </div>
                    <div id="calendarGrid"></div>
                </div>
            </div>
        </div>
    </div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    
    let firestore;
    const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    let monthlyRevenueChart;

    if (typeof firebase !== 'undefined' && typeof firebaseConfig !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        firestore = firebase.firestore();
    }

    class FirebaseDB {
        constructor() { this.coll = firestore.collection("bookings"); }
        async getAll() { const s = await this.coll.orderBy("date").get(); return s.docs.map(d => ({id: d.id, ...d.data()})); }
        async add(data) {
            const h = (new Date(`1970-01-01T${data.endTime}`) - new Date(`1970-01-01T${data.startTime}`)) / 3600000;
            return await this.coll.add({...data, hours: h, totalPayment: h * data.pricePerHour});
        }
        async delete(id) { await this.coll.doc(id).delete(); }
    }
    const db = new FirebaseDB();

    // --- BUTTON FIXES (EXPORT / IMPORT / REPORT) ---

    async function exportToExcel() {
        const bs = await db.getAll();
        const ws = XLSX.utils.json_to_sheet(bs.map(b => ({
            Pitch: b.pitch, Client: b.clientName, Contact: b.contact, Date: b.date, 
            Start: b.startTime, End: b.endTime, Hours: b.hours, Total: b.totalPayment
        })));
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Bookings");
        XLSX.writeFile(wb, "Palace_Sports_Bookings.xlsx");
    }

    async function importFromExcel(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (evt) => {
            const data = new Uint8Array(evt.target.result);
            const wb = XLSX.read(data, {type: 'array'});
            const jsonData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            for(let item of jsonData) {
                await db.add({
                    pitch: item.Pitch, clientName: item.Client, contact: item.Contact || '',
                    date: item.Date, startTime: item.Start, endTime: item.End,
                    pricePerHour: item.Rate || 0
                });
            }
            alert("Import Complete");
            location.reload();
        };
        reader.readAsArrayBuffer(file);
    }

    // --- DASHBOARD DATA LOADING ---

    async function updateDashboard() {
        const bs = await db.getAll();
        const now = new Date();
        const curY = now.getFullYear();
        const curM = now.getMonth();

        // Stats
        document.getElementById('totalRevenue').textContent = `AED ${bs.reduce((s,b)=>s+b.totalPayment,0).toLocaleString()}`;
        document.getElementById('monthlyRevenue').textContent = `AED ${bs.filter(b => {
            const d = new Date(b.date);
            return d.getMonth() === curM && d.getFullYear() === curY;
        }).reduce((s,b)=>s+b.totalPayment,0).toLocaleString()}`;
        document.getElementById('totalBookingsCount').textContent = bs.length;

        // Year Filter Setup
        const years = [...new Set(bs.map(b => new Date(b.date).getFullYear()))].sort((a,b)=>b-a);
        const yf = document.getElementById('yearFilter');
        if(yf.options.length === 0) {
            if(years.length === 0) years.push(curY);
            years.forEach(y => yf.innerHTML += `<option value="${y}">${y}</option>`);
        }

        // Chart
        const selY = parseInt(yf.value || curY);
        const chartData = Array(12).fill(0);
        bs.filter(b => new Date(b.date).getFullYear() === selY).forEach(b => chartData[new Date(b.date).getMonth()] += b.totalPayment);
        
        const ctx = document.getElementById('monthlyRevenueChart').getContext('2d');
        if(monthlyRevenueChart) monthlyRevenueChart.destroy();
        monthlyRevenueChart = new Chart(ctx, {
            type: 'bar', 
            data: { labels: monthNames.map(m=>m.slice(0,3)), datasets: [{ label: 'Revenue', data: chartData, backgroundColor: '#667eea' }]},
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    // --- AI REPORT LOGIC ---

    document.getElementById('reportButton').onclick = async () => {
        const bs = await db.getAll();
        const years = [...new Set(bs.map(b => new Date(b.date).getFullYear()))].sort((a,b)=>b-a);
        document.getElementById('reportYearSelect').innerHTML = years.map(y=>`<option>${y}</option>`).join('');
        const ops = monthNames.map((m,i)=>`<option value="${i}">${m}</option>`).join('');
        document.getElementById('reportStartMonth').innerHTML = ops;
        document.getElementById('reportEndMonth').innerHTML = ops;
        document.getElementById('report-modal-overlay').style.display = 'flex';
    };

    document.getElementById('generateFinalReport').onclick = async () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const yr = parseInt(document.getElementById('reportYearSelect').value);
        const start = parseInt(document.getElementById('reportStartMonth').value);
        const end = parseInt(document.getElementById('reportEndMonth').value);
        
        const bs = (await db.getAll()).filter(b => {
            const d = new Date(b.date);
            return d.getFullYear() === yr && d.getMonth() >= start && d.getMonth() <= end;
        });
        
        doc.text(`Revenue Report: ${monthNames[start]} - ${monthNames[end]} ${yr}`, 14, 20);
        doc.autoTable({
            startY: 30,
            head: [['Date', 'Pitch', 'Client', 'Revenue']],
            body: bs.map(b => [b.date, b.pitch, b.clientName, `AED ${b.totalPayment.toFixed(2)}`])
        });
        doc.save("Palace_Sports_Report.pdf");
        document.getElementById('report-modal-overlay').style.display = 'none';
    };

    // --- OTHER CORE FUNCTIONS ---

    async function displayBookings() {
        const bs = await db.getAll();
        const cf = document.getElementById('filterClientName').value.toLowerCase();
        const pf = document.getElementById('filterPitch').value;
        const mf = document.getElementById('filterMonth').value;
        const yf = document.getElementById('filterYear').value;

        const filtered = bs.filter(b => {
            const d = new Date(b.date);
            return (!cf || b.clientName.toLowerCase().includes(cf)) &&
                   (!pf || b.pitch === pf) &&
                   (mf === "" || d.getMonth() == mf) &&
                   (yf === "" || d.getFullYear() == yf);
        });

        document.getElementById('bookingsTableBody').innerHTML = filtered.map(b => `
            <tr>
                <td>${b.pitch}</td><td>${b.clientName}</td><td>${b.date}</td><td>${b.startTime}</td><td>${b.endTime}</td>
                <td>${b.hours.toFixed(1)}h</td><td>${b.pricePerHour}</td><td>AED ${b.totalPayment.toFixed(2)}</td>
                <td><button class="delete-btn" onclick="window.delBooking('${b.id}')">Delete</button></td>
            </tr>
        `).join('');
    }

    window.delBooking = async (id) => { if(confirm("Delete?")) { await db.delete(id); location.reload(); }};

    function initFilters() {
        document.getElementById('filterMonth').innerHTML = '<option value="">All Months</option>' + monthNames.map((m,i) => `<option value="${i}">${m}</option>`).join('');
        document.getElementById('filterYear').innerHTML = '<option value="">All Years</option><option>2025</option><option>2026</option>';
        document.getElementById('filterPitch').innerHTML = '<option value="">All Pitches</option><option>Fifa Pitch</option><option>Junior Football Pitch</option><option>Airdome</option><option>Half Pitch</option>';
    }

    // --- EVENTS ---

    document.getElementById('loginButton').onclick = () => {
        if(document.getElementById('username').value === "EPsports2025" && document.getElementById('password').value === "EPsport@25") {
            localStorage.setItem('isLoggedIn', 'true');
            showApp();
        } else { document.getElementById('login-error').style.display = 'block'; }
    };

    document.getElementById('addBookingButton').onclick = async () => {
        const data = {
            pitch: document.getElementById('pitch').value, clientName: document.getElementById('clientName').value,
            contact: document.getElementById('contact').value, date: document.getElementById('bookingDate').value,
            startTime: document.getElementById('startTime').value, endTime: document.getElementById('endTime').value,
            pricePerHour: parseFloat(document.getElementById('pricePerHour').value || 0)
        };
        const rType = document.getElementById('recurringType').value;
        const rCount = parseInt(document.getElementById('recurringCount').value) || 1;

        for(let i=0; i < (rType === 'none' ? 1 : rCount); i++) {
            let nextDate = new Date(data.date);
            if(rType === 'weekly') nextDate.setDate(nextDate.getDate() + (i * 7));
            if(rType === 'monthly') nextDate.setMonth(nextDate.getMonth() + i);
            await db.add({...data, date: nextDate.toISOString().split('T')[0]});
        }
        location.reload();
    };

    document.getElementById('recurringType').onchange = (e) => {
        document.getElementById('recurring-options').style.display = (e.target.value === 'none' ? 'none' : 'block');
    };

    document.getElementById('exportButton').onclick = exportToExcel;
    document.getElementById('importButton').onclick = () => document.getElementById('importFile').click();
    document.getElementById('importFile').onchange = importFromExcel;
    document.getElementById('closeReportModal').onclick = () => document.getElementById('report-modal-overlay').style.display = 'none';

    document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
        document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
        document.querySelectorAll('.tab').forEach(tb => tb.classList.remove('active'));
        document.getElementById(t.dataset.tab + '-content').style.display = 'block';
        t.classList.add('active');
        if(t.dataset.tab === 'dashboard') updateDashboard();
    });

    ['startTime', 'endTime', 'pricePerHour'].forEach(id => {
        document.getElementById(id).oninput = () => {
            const s = document.getElementById('startTime').value;
            const e = document.getElementById('endTime').value;
            const p = parseFloat(document.getElementById('pricePerHour').value || 0);
            if(s && e) {
                const h = (new Date(`1970-01-01T${e}`) - new Date(`1970-01-01T${s}`)) / 3600000;
                document.getElementById('totalHours').value = h.toFixed(2);
                document.getElementById('totalPayment').value = (h * p).toFixed(2);
            }
        };
    });

    function showApp() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-wrapper').style.display = 'block';
        initFilters();
        displayBookings();
        updateDashboard();
    }

    if(localStorage.getItem('isLoggedIn') === 'true') showApp();
    else document.getElementById('login-screen').style.display = 'flex';
});
</script>
</body>
</html>
