<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Pitch Booking System</title>
    
    <script src="firebase-config.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        /* Existing Styles */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height:100vh; padding:20px; }
        .container { max-width:1400px; margin:0 auto; background:white; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,0.1); overflow:hidden; }
        .header { background:linear-gradient(135deg, #2c3e50, #34495e); color:white; padding:30px; text-align:center; position:relative; }
        .header h1 { font-size:2.5em; margin-bottom:10px; }
        .header-btn { background:rgba(255,255,255,0.2); border:2px solid rgba(255,255,255,0.3); color:white; padding:10px 20px; border-radius:25px; cursor:pointer; font-size:14px; font-weight:600; }
        .export-btn { position:absolute; top:20px; right:20px; }
        .import-btn { position:absolute; top:20px; right:150px; }
        
        /* New Report Button Styles */
        .report-btn { position:absolute; top:70px; right:20px; background: #28a745 !important; border-color: #1e7e34; }
        
        .signout-btn { position:absolute; top:20px; left:20px; background:#dc3545; }
        .tabs { display:flex; background:#f8f9fa; border-bottom:3px solid #e9ecef; }
        .tab { flex:1; padding:20px; text-align:center; background:#e9ecef; cursor:pointer; font-weight:bold; transition: 0.3s; }
        .tab.active { background:white; color:#2c3e50; border-top: 4px solid #667eea; }
        .content { padding:30px; }
        .booking-form, .filter-bar { background:#f8f9fa; padding:20px; border-radius:15px; margin-bottom:30px; }
        .form-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:20px; margin-bottom:20px; }
        .form-group { display:flex; flex-direction:column; }
        .form-group label { font-weight:600; margin-bottom:8px; }
        .form-group input, .form-group select { padding:12px; border:2px solid #e9ecef; border-radius:10px; }
        .btn { padding:12px 20px; background:linear-gradient(135deg, #667eea, #764ba2); color:white; border:none; border-radius:25px; cursor:pointer; font-weight:600; }
        .booking-table { margin-top:20px; border-radius:15px; overflow:hidden; border: 1px solid #eee; }
        .booking-table table { width:100%; border-collapse:collapse; }
        .booking-table th { background:#34495e; color:white; padding:15px; text-align: left; }
        .booking-table td { padding:12px; border-bottom:1px solid #eee; }
        .dashboard-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:20px; }
        .dashboard-card { background:#f9f9f9; padding:20px; border-radius:15px; border: 1px solid #eee; }
        .metric { background:#667eea; color:white; border-radius:10px; padding:15px; text-align:center; }
        .metric-value { font-size:2em; font-weight:bold; }
        
        /* Calendar Styles */
        #calendarGrid { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
        .calendar-day { background:#fff; border:1px solid #ddd; border-radius:10px; padding:10px; min-height:100px; }
        .calendar-day-header { font-weight: bold; margin-bottom: 5px; border-bottom: 1px solid #eee; }
        .calendar-event { font-size: 0.75em; background: #eef2ff; padding: 2px 5px; border-radius: 4px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid #667eea; }

        /* Modal Styles */
        #login-screen, #report-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .login-box, .modal-box { background: white; padding: 40px; border-radius: 20px; width: 100%; max-width: 450px; }
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="login-box">
            <h2 style="text-align:center; margin-bottom:20px;">⚽ Login</h2>
            <div class="form-group"><label>Username</label><input id="username" type="text"></div><br>
            <div class="form-group"><label>Password</label><input id="password" type="password"></div><br>
            <button id="loginButton" class="btn" style="width: 100%;">Login</button>
            <p id="login-error" style="color: #dc3545; margin-top: 15px; text-align:center; display: none;">Invalid credentials.</p>
        </div>
    </div>

    <div id="report-modal-overlay">
        <div class="modal-box">
            <h2 style="text-align:center; margin-bottom:20px;">📄 Generate AI Performance Report</h2>
            <div class="form-group">
                <label>Select Year</label>
                <select id="reportYearSelect"></select>
            </div>
            <div class="form-row" style="margin-top:15px;">
                <div class="form-group"><label>From</label><select id="reportStartMonth"></select></div>
                <div class="form-group"><label>To</label><select id="reportEndMonth"></select></div>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 25px;">
                <button id="generateFinalReport" class="btn" style="flex: 1; background: #28a745;">Download Report</button>
                <button id="closeReportModal" class="btn" style="flex: 1; background: #6c757d;">Cancel</button>
            </div>
        </div>
    </div>

    <div id="app-wrapper" style="display:none;">
        <div class="container">
            <div class="header">
                <button id="signOutButton" class="header-btn signout-btn">Sign Out</button>
                <h1>⚽ Football Pitch Booking System</h1>
                <button id="importButton" class="header-btn import-btn">📥 Import</button>
                <button id="exportButton" class="header-btn export-btn">📊 Export</button>
                <button id="reportButton" class="header-btn report-btn">📄 Generate Report</button>
            </div>

            <div class="tabs">
                <div class="tab active" data-tab="bookings">📋 Bookings</div>
                <div class="tab" data-tab="dashboard">📊 Dashboard</div>
                <div class="tab" data-tab="calendar">📅 Calendar</div>
            </div>

            <div class="content">
                <div id="bookings-content" class="tab-content">
                    <form id="bookingForm" class="booking-form">
                        <div class="form-row">
                            <div class="form-group"><label>Pitch</label><select id="pitch"><option>Fifa Pitch</option><option>Junior Football Pitch</option><option>Airdome</option><option>Half Pitch</option></select></div>
                            <div class="form-group"><label>Client Name</label><input id="clientName"></div>
                            <div class="form-group"><label>Contact</label><input id="contact"></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label>Date</label><input type="date" id="bookingDate"></div>
                            <div class="form-group"><label>Start Time</label><input type="time" id="startTime"></div>
                            <div class="form-group"><label>End Time</label><input type="time" id="endTime"></div>
                            <div class="form-group"><label>Price/hr</label><input type="number" id="pricePerHour" value="500"></div>
                        </div>
                        <button id="addBookingButton" class="btn" type="button">Add Booking</button>
                    </form>

                    <div class="filter-bar">
                        <input type="text" id="filterClientName" placeholder="Search Client...">
                        <select id="filterMonth"></select>
                        <select id="filterYear"></select>
                    </div>

                    <div class="booking-table">
                        <table><thead><tr><th>Pitch</th><th>Client</th><th>Date</th><th>Time</th><th>Total</th><th>Action</th></tr></thead><tbody id="bookingsTableBody"></tbody></table>
                    </div>
                </div>

                <div id="dashboard-content" class="tab-content" style="display:none;">
                    <div class="dashboard-grid">
                        <div class="dashboard-card"><div class="card-title">Total Revenue</div><div class="metric"><div id="totalRevenue" class="metric-value">0</div></div></div>
                        <div class="dashboard-card"><div class="card-title">Bookings Count</div><div class="metric"><div id="totalBookingsCount" class="metric-value">0</div></div></div>
                        <div class="dashboard-card" style="grid-column: 1 / -1;"><canvas id="monthlyRevenueChart" height="100"></canvas></div>
                    </div>
                </div>

                <div id="calendar-content" class="tab-content" style="display:none;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                        <button id="prevMonthBtn" class="btn">Prev</button>
                        <h2 id="calendarMonthLabel"></h2>
                        <button id="nextMonthBtn" class="btn">Next</button>
                    </div>
                    <div id="calendarGrid"></div>
                </div>
            </div>
        </div>
    </div>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    // --- DATABASE & CORE ---
    let firestore;
    try {
        firebase.initializeApp(firebaseConfig);
        firestore = firebase.firestore();
    } catch (e) { console.error("Firebase Error", e); }

    const db = {
        async getAll() {
            const snap = await firestore.collection("bookings").orderBy("date").get();
            return snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        },
        async add(data) {
            const start = new Date(`1970-01-01T${data.startTime}`);
            const end = new Date(`1970-01-01T${data.endTime}`);
            const hours = (end - start) / 3600000;
            const finalData = { ...data, hours, totalPayment: hours * data.pricePerHour };
            await firestore.collection("bookings").add(finalData);
        },
        async delete(id) { await firestore.collection("bookings").doc(id).delete(); }
    };

    const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    let currentCalDate = new Date();
    let revenueChart = null;

    // --- TABS LOGIC ---
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab, .tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
            tab.classList.add('active');
            const target = document.getElementById(tab.dataset.tab + '-content');
            target.style.display = 'block';
            if(tab.dataset.tab === 'dashboard') updateDashboard();
            if(tab.dataset.tab === 'calendar') renderCalendar();
        });
    });

    // --- DASHBOARD ---
    async function updateDashboard() {
        const bookings = await db.getAll();
        document.getElementById('totalRevenue').textContent = `AED ${bookings.reduce((s, b) => s + b.totalPayment, 0).toLocaleString()}`;
        document.getElementById('totalBookingsCount').textContent = bookings.length;

        const monthlyData = Array(12).fill(0);
        bookings.forEach(b => {
            const m = new Date(b.date).getMonth();
            monthlyData[m] += b.totalPayment;
        });

        if (revenueChart) revenueChart.destroy();
        const ctx = document.getElementById('monthlyRevenueChart').getContext('2d');
        revenueChart = new Chart(ctx, {
            type: 'bar',
            data: { labels: monthNames, datasets: [{ label: 'Revenue (AED)', data: monthlyData, backgroundColor: '#667eea' }]}
        });
    }

    // --- CALENDAR ---
    async function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';
        const year = currentCalDate.getFullYear();
        const month = currentCalDate.getMonth();
        document.getElementById('calendarMonthLabel').textContent = `${monthNames[month]} ${year}`;

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const bookings = await db.getAll();

        for (let i = 0; i < firstDay; i++) grid.innerHTML += '<div></div>';
        for (let d = 1; d <= daysInMonth; d++) {
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const dayBookings = bookings.filter(b => b.date === dateStr);
            let html = `<div class="calendar-day"><div class="calendar-day-header">${d}</div>`;
            dayBookings.forEach(b => {
                html += `<div class="calendar-event">${b.startTime} - ${b.clientName}</div>`;
            });
            html += `</div>`;
            grid.innerHTML += html;
        }
    }

    document.getElementById('prevMonthBtn').addEventListener('click', () => { currentCalDate.setMonth(currentCalDate.getMonth()-1); renderCalendar(); });
    document.getElementById('nextMonthBtn').addEventListener('click', () => { currentCalDate.setMonth(currentCalDate.getMonth()+1); renderCalendar(); });

    // --- BOOKINGS TABLE ---
    async function refreshTable() {
        const bookings = await db.getAll();
        const tbody = document.getElementById('bookingsTableBody');
        tbody.innerHTML = bookings.map(b => `
            <tr>
                <td>${b.pitch}</td><td>${b.clientName}</td><td>${b.date}</td>
                <td>${b.startTime}-${b.endTime}</td><td>AED ${b.totalPayment.toFixed(2)}</td>
                <td><button onclick="deleteBooking('${b.id}')" class="delete-btn" style="background:#dc3545; color:white; border:none; padding:5px 10px; border-radius:15px; cursor:pointer;">Del</button></td>
            </tr>
        `).join('');
    }

    window.deleteBooking = async (id) => { if(confirm("Delete?")) { await db.delete(id); refreshTable(); } };

    document.getElementById('addBookingButton').addEventListener('click', async () => {
        const data = {
            pitch: document.getElementById('pitch').value, clientName: document.getElementById('clientName').value,
            contact: document.getElementById('contact').value, date: document.getElementById('bookingDate').value,
            startTime: document.getElementById('startTime').value, endTime: document.getElementById('endTime').value,
            pricePerHour: parseFloat(document.getElementById('pricePerHour').value)
        };
        await db.add(data);
        refreshTable();
    });

    // --- REPORTING LOGIC ---
    document.getElementById('reportButton').addEventListener('click', () => {
        const yearSel = document.getElementById('reportYearSelect');
        yearSel.innerHTML = [2024, 2025, 2026].map(y => `<option value="${y}">${y}</option>`).join('');
        const monthOps = monthNames.map((m, i) => `<option value="${i}">${m}</option>`).join('');
        document.getElementById('reportStartMonth').innerHTML = monthOps;
        document.getElementById('reportEndMonth').innerHTML = monthOps;
        document.getElementById('report-modal-overlay').style.display = 'flex';
    });

    document.getElementById('closeReportModal').addEventListener('click', () => {
        document.getElementById('report-modal-overlay').style.display = 'none';
    });

    document.getElementById('generateFinalReport').addEventListener('click', async () => {
        const year = parseInt(document.getElementById('reportYearSelect').value);
        const start = parseInt(document.getElementById('reportStartMonth').value);
        const end = parseInt(document.getElementById('reportEndMonth').value);
        
        const all = await db.getAll();
        const periodData = all.filter(b => {
            const d = new Date(b.date);
            return d.getFullYear() === year && d.getMonth() >= start && d.getMonth() <= end;
        });

        if (periodData.length === 0) { alert("No data for this period."); return; }

        // AI Logic: Detect Bottlenecks
        const pitchUsage = {};
        periodData.forEach(b => pitchUsage[b.pitch] = (pitchUsage[b.pitch] || 0) + 1);
        const busiestPitch = Object.keys(pitchUsage).reduce((a, b) => pitchUsage[a] > pitchUsage[b] ? a : b);
        const totalRev = periodData.reduce((s, b) => s + b.totalPayment, 0);

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFontSize(20); doc.text("Palace Sports performance Report", 14, 20);
        doc.setFontSize(12); doc.text(`Period: ${monthNames[start]} - ${monthNames[end]} ${year}`, 14, 30);
        
        doc.setFontSize(14); doc.text("AI Strategic Analysis", 14, 45);
        doc.setFontSize(10);
        doc.text(`• Peak Bottleneck: ${busiestPitch} is reaching maximum capacity.`, 14, 55);
        doc.text(`• Financial Insight: Total Revenue for this period is AED ${totalRev.toLocaleString()}.`, 14, 62);
        doc.text(`• Suggestion: Implement a premium rate for ${busiestPitch} during evening peak hours.`, 14, 69);
        doc.text(`• Growth Plan: Introduce morning "Early Bird" discounts to fill empty slots.`, 14, 76);

        const tableRows = periodData.map(b => [b.date, b.clientName, b.pitch, b.startTime, `AED ${b.totalPayment}`]);
        doc.autoTable({ startY: 85, head: [['Date', 'Client', 'Pitch', 'Time', 'Revenue']], body: tableRows });

        doc.save(`Performance_Report_${year}.pdf`);
        document.getElementById('report-modal-overlay').style.display = 'none';
    });

    // --- AUTH ---
    document.getElementById('loginButton').addEventListener('click', () => {
        if(document.getElementById('username').value === "EPsports2025") {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-wrapper').style.display = 'block';
            refreshTable();
            populateFilterSelectors();
        }
    });

    function populateFilterSelectors() {
        const m = document.getElementById('filterMonth');
        m.innerHTML = '<option value="">All Months</option>' + monthNames.map((n, i) => `<option value="${i}">${n}</option>`).join('');
        const y = document.getElementById('filterYear');
        y.innerHTML = '<option value="">All Years</option><option>2024</option><option>2025</option><option>2026</option>';
    }
});
</script>
</body>
</html>
