<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Pitch Booking System</title>
    
    <script src="firebase-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI', sans-serif; background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height:100vh; padding:20px; }
        .container { max-width:1400px; margin:0 auto; background:white; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,0.1); overflow:hidden; }
        .header { background:linear-gradient(135deg, #2c3e50, #34495e); color:white; padding:30px; text-align:center; position:relative; }
        .header-controls { display: flex; justify-content: center; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        .header-btn { background:rgba(255,255,255,0.2); border:2px solid rgba(255,255,255,0.3); color:white; padding:8px 16px; border-radius:25px; cursor:pointer; font-size:13px; font-weight:600; }
        .report-btn { background: #28a745 !important; border: none; }
        .signout-btn { background:#dc3545 !important; border:none; }
        .tabs { display:flex; background:#f8f9fa; border-bottom:3px solid #e9ecef; }
        .tab { flex:1; padding:18px; text-align:center; background:#e9ecef; cursor:pointer; font-weight:bold; }
        .tab.active { background:white; color:#2c3e50; }
        .content { padding:25px; }
        .booking-form, .filter-bar { background:#f8f9fa; padding:20px; border-radius:15px; margin-bottom:25px; border: 1px solid #eee; }
        .form-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:15px; margin-bottom:15px; }
        .form-group { display:flex; flex-direction:column; }
        .form-group label { font-weight:600; margin-bottom:6px; font-size: 14px; }
        .form-group input, .form-group select { padding:10px; border:2px solid #e9ecef; border-radius:10px; }
        .btn { padding:12px 20px; background:linear-gradient(135deg, #667eea, #764ba2); color:white; border:none; border-radius:25px; cursor:pointer; font-weight:600; transition: 0.3s; }
        .booking-table { width: 100%; overflow-x: auto; border-radius: 15px; margin-top: 15px; }
        table { width:100%; border-collapse:collapse; min-width: 900px; }
        th { background:#34495e; color:white; padding:15px; text-align: left; }
        td { padding:12px; border-bottom:1px solid #eee; font-size: 14px; }
        .dashboard-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:20px; }
        .dashboard-card { background:#fff; padding:20px; border-radius:15px; border: 1px solid #eee; }
        .metric { background:#667eea; color:white; border-radius:12px; padding:20px; text-align:center; margin-top: 10px; }
        .metric-value { font-size:1.8em; font-weight:bold; }
        #calendarGrid { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
        #calendarGrid div { background:#fff; border:1px solid #eee; border-radius:8px; padding:6px; min-height:90px; }
        .cal-event { color:white; padding:3px 6px; font-size:11px; border-radius:4px; margin-top:3px; cursor:pointer; }
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; z-index: 5000; }
        .login-box { background: white; padding: 40px; border-radius: 20px; width: 400px; text-align: center; }
        #report-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 4500; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>⚽ Palace Sports</h2>
            <div class="form-group" style="text-align:left; margin-top:20px;"><label>Username</label><input id="username" type="text"></div>
            <div class="form-group" style="text-align:left; margin-top:15px;"><label>Password</label><input id="password" type="password"></div>
            <button id="loginButton" class="btn" style="width:100%; margin-top:20px;">Login</button>
            <p id="login-error" style="color:#dc3545; display:none; margin-top:10px;">Invalid Credentials</p>
        </div>
    </div>

    <div id="report-modal-overlay">
        <div class="modal-box" style="background:white; padding:35px; border-radius:20px; width: 400px;">
            <h2 style="text-align:center; margin-bottom:20px;">📄 AI Performance Report</h2>
            <div class="form-group"><label>Select Year</label><select id="reportYearSelect"></select></div>
            <div class="form-row" style="margin-top:15px;">
                <div class="form-group"><label>From</label><select id="reportStartMonth"></select></div>
                <div class="form-group"><label>To</label><select id="reportEndMonth"></select></div>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 25px;">
                <button id="generateFinalReport" class="btn" style="flex:1; background: #28a745;">Export PDF</button>
                <button id="closeReportModal" class="btn" style="flex:1; background: #6c757d;">Cancel</button>
            </div>
        </div>
    </div>

    <div id="app-wrapper" style="display:none;">
        <div class="container">
            <div class="header">
                <button id="signOutButton" class="header-btn signout-btn" style="position:absolute; left:20px; top:25px;">Sign Out</button>
                <h1>Football Pitch Booking System</h1>
                <div class="header-controls">
                    <button id="reportButton" class="header-btn report-btn">📄 AI Report</button>
                    <input type="file" id="importFile" style="display:none;" accept=".xlsx, .xls">
                    <button id="importButton" class="header-btn">📥 Import Data</button>
                    <button id="exportButton" class="header-btn">📊 Export Excel</button>
                </div>
            </div>

            <div class="tabs">
                <div class="tab active" data-tab="bookings">📋 Bookings</div>
                <div class="tab" data-tab="dashboard">📊 Dashboard</div>
                <div class="tab" data-tab="calendar">📅 Calendar</div>
            </div>

            <div class="content">
                <div id="bookings-content" class="tab-content">
                    <form id="bookingForm" class="booking-form">
                        <h3>New Booking</h3>
                        <div class="form-row">
                            <div class="form-group"><label>Pitch</label><select id="pitch"><option>Fifa Pitch</option><option>Junior Football Pitch</option><option>Airdome</option><option>Half Pitch</option></select></div>
                            <div class="form-group"><label>Client</label><input id="clientName"></div>
                            <div class="form-group"><label>Contact</label><input id="contact"></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label>Date</label><input type="date" id="bookingDate"></div>
                            <div class="form-group"><label>Start</label><input type="time" id="startTime"></div>
                            <div class="form-group"><label>End</label><input type="time" id="endTime"></div>
                            <div class="form-group"><label>Rate (AED/hr)</label><input type="number" id="pricePerHour"></div>
                        </div>
                        <button id="addBookingButton" class="btn" type="button">Add Booking</button>
                    </form>

                    <div class="filter-bar">
                        <div class="form-row">
                            <div class="form-group"><label>Client Name</label><input type="text" id="filterClientName"></div>
                            <div class="form-group"><label>Pitch</label><select id="filterPitch"><option value="">All</option><option>Fifa Pitch</option><option>Junior Football Pitch</option><option>Airdome</option><option>Half Pitch</option></select></div>
                            <div class="form-group"><label>Month</label><select id="filterMonth"></select></div>
                            <div class="form-group"><label>Year</label><select id="filterYear"></select></div>
                        </div>
                        <button id="clearFiltersButton" class="btn" style="width: auto;">Reset Filters</button>
                    </div>

                    <div class="booking-table">
                        <table>
                            <thead><tr><th>Pitch</th><th>Client</th><th>Date</th><th>Start</th><th>End</th><th>Total</th><th>Action</th></tr></thead>
                            <tbody id="bookingsTableBody"></tbody>
                        </table>
                    </div>
                </div>

                <div id="dashboard-content" class="tab-content" style="display:none;">
                    <div class="dashboard-grid">
                        <div class="dashboard-card"><div>Total Revenue</div><div class="metric"><div id="totalRevenue" class="metric-value">AED 0</div></div></div>
                        <div class="dashboard-card">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <strong>Pitch Revenue</strong>
                                <div style="display:flex; gap:5px;"><select id="pitchRevenueMonthFilter" style="font-size:11px;"></select><select id="pitchRevenueYearFilter" style="font-size:11px;"></select></div>
                            </div>
                            <div id="pitchRevenueBreakdown" style="margin-top:15px;"></div>
                        </div>
                        <div class="dashboard-card">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <strong>Repeat Clients</strong>
                                <div style="display:flex; gap:5px;"><select id="repeatClientMonthFilter" style="font-size:11px;"></select><select id="repeatClientYearFilter" style="font-size:11px;"></select></div>
                            </div>
                            <div id="repeatClientRevenue" style="margin-top:15px;"></div>
                        </div>
                        <div class="dashboard-card" style="grid-column: 1 / -1; height: 350px;">
                            <div style="display:flex; justify-content:space-between;"><strong>Monthly Trend</strong><select id="yearFilter"></select></div>
                            <canvas id="monthlyRevenueChart"></canvas>
                        </div>
                    </div>
                </div>

                <div id="calendar-content" class="tab-content" style="display:none;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                        <button id="prevMonthBtn" class="btn">⬅</button>
                        <h2 id="calendarMonth"></h2>
                        <button id="nextMonthBtn" class="btn">➡</button>
                    </div>
                    <div id="calendarGrid"></div>
                </div>
            </div>
        </div>
    </div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    let firestore;
    const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    let monthlyRevenueChart;

    // Firebase Setup
    try {
        if (typeof firebase !== 'undefined' && typeof firebaseConfig !== 'undefined') {
            firebase.initializeApp(firebaseConfig);
            firestore = firebase.firestore();
        }
    } catch (e) { console.error("Firebase Error", e); }

    class DB {
        constructor() { this.coll = firestore.collection("bookings"); }
        async getAll() { const s = await this.coll.orderBy("date").get(); return s.docs.map(d => ({id: d.id, ...d.data()})); }
        async add(data) {
            const h = (new Date(`1970-01-01T${data.endTime}`) - new Date(`1970-01-01T${data.startTime}`)) / 3600000;
            return await this.coll.add({...data, hours: h, totalPayment: h * data.pricePerHour});
        }
        async delete(id) { await this.coll.doc(id).delete(); }
    }
    const db = new DB();

    // Reset Filters Function
    window.clearBookingFilters = () => {
        document.getElementById('filterClientName').value = '';
        document.getElementById('filterPitch').value = '';
        document.getElementById('filterMonth').value = '';
        document.getElementById('filterYear').value = '';
        drawTable();
    };

    // Export Function
    window.exportToExcel = async () => {
        const bs = await db.getAll();
        const ws = XLSX.utils.json_to_sheet(bs);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Bookings");
        XLSX.writeFile(wb, "Palace_Sports_Data.xlsx");
    };

    // Import Function
    document.getElementById('importButton').onclick = () => document.getElementById('importFile').click();
    document.getElementById('importFile').onchange = (e) => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = async (evt) => {
            const data = new Uint8Array(evt.target.result);
            const wb = XLSX.read(data, {type: 'array'});
            const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            for(let row of json) await db.add(row);
            location.reload();
        };
        reader.readAsArrayBuffer(file);
    };

    // AI Report Logic
    document.getElementById('reportButton').onclick = async () => {
        const bs = await db.getAll();
        const years = [...new Set(bs.map(b => new Date(b.date).getFullYear()))].sort((a,b)=>b-a);
        document.getElementById('reportYearSelect').innerHTML = (years.length ? years : [2026]).map(y=>`<option>${y}</option>`).join('');
        document.getElementById('reportStartMonth').innerHTML = monthNames.map((m,i)=>`<option value="${i}">${m}</option>`).join('');
        document.getElementById('reportEndMonth').innerHTML = monthNames.map((m,i)=>`<option value="${i}">${m}</option>`).join('');
        document.getElementById('report-modal-overlay').style.display = 'flex';
    };

    document.getElementById('generateFinalReport').onclick = async () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const yr = parseInt(document.getElementById('reportYearSelect').value);
        const start = parseInt(document.getElementById('reportStartMonth').value);
        const end = parseInt(document.getElementById('reportEndMonth').value);
        const all = await db.getAll();
        const filtered = all.filter(b => { const d = new Date(b.date); return d.getFullYear()===yr && d.getMonth()>=start && d.getMonth()<=end; });
        
        doc.setFontSize(20); doc.text("Revenue Performance Report", 14, 20);
        doc.setFontSize(12); doc.text(`Period: ${monthNames[start]} - ${monthNames[end]} ${yr}`, 14, 30);
        const total = filtered.reduce((s,b)=>s+b.totalPayment,0);
        doc.text(`Total Revenue: AED ${total.toLocaleString()}`, 14, 45);
        
        doc.autoTable({ startY: 55, head: [['Date', 'Pitch', 'Client', 'Amount']], body: filtered.map(b=>[b.date, b.pitch, b.clientName, b.totalPayment.toFixed(2)]) });
        doc.save("Palace_Sports_Report.pdf");
        document.getElementById('report-modal-overlay').style.display = 'none';
    };

    // Dashboard Logic
    async function updateDashboard() {
        const bs = await db.getAll();
        const now = new Date();
        const curY = now.getFullYear();
        const curM = now.getMonth();

        // Populate Filters
        const years = [...new Set(bs.map(b => new Date(b.date).getFullYear()))].sort((a,b)=>b-a);
        if(!years.length) years.push(2026);
        
        ['yearFilter', 'pitchRevenueYearFilter', 'repeatClientYearFilter'].forEach(id => {
            const el = document.getElementById(id);
            if(!el.innerHTML) { years.forEach(y => el.innerHTML += `<option value="${y}">${y}</option>`); el.value = curY; }
        });
        ['pitchRevenueMonthFilter', 'repeatClientMonthFilter'].forEach(id => {
            const el = document.getElementById(id);
            if(!el.innerHTML) { monthNames.forEach((m,i) => el.innerHTML += `<option value="${i}">${m}</option>`); el.value = curM; }
        });

        // Metrics
        document.getElementById('totalRevenue').textContent = `AED ${bs.reduce((s,b)=>s+b.totalPayment,0).toLocaleString()}`;
        
        const pY = parseInt(document.getElementById('pitchRevenueYearFilter').value);
        const pM = parseInt(document.getElementById('pitchRevenueMonthFilter').value);
        const pData = bs.filter(b => { const d = new Date(b.date); return d.getFullYear()===pY && d.getMonth()===pM; });
        const pRev = pData.reduce((acc,b) => { acc[b.pitch] = (acc[b.pitch]||0) + b.totalPayment; return acc; }, {});
        document.getElementById('pitchRevenueBreakdown').innerHTML = Object.entries(pRev).map(([p,r])=>`<div style="display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid #eee;"><b>${p}</b><span>AED ${r.toLocaleString()}</span></div>`).join('') || "No data";

        const rY = parseInt(document.getElementById('repeatClientYearFilter').value);
        const rM = parseInt(document.getElementById('repeatClientMonthFilter').value);
        const rData = bs.filter(b => { const d = new Date(b.date); return d.getFullYear()===rY && d.getMonth()===rM; });
        const cTotals = rData.reduce((acc,b) => { acc[b.clientName] = (acc[b.clientName]||0) + b.totalPayment; return acc; }, {});
        const repeats = Object.entries(cTotals).filter(([n]) => rData.filter(b=>b.clientName===n).length > 1);
        document.getElementById('repeatClientRevenue').innerHTML = repeats.map(([n,t])=>`<div style="display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid #eee;"><b>${n}</b><span>AED ${t.toLocaleString()}</span></div>`).join('') || "No repeat clients";

        const selY = parseInt(document.getElementById('yearFilter').value);
        const cData = Array(12).fill(0);
        bs.filter(b=>new Date(b.date).getFullYear()===selY).forEach(b=> cData[new Date(b.date).getMonth()] += b.totalPayment);
        if(monthlyRevenueChart) monthlyRevenueChart.destroy();
        monthlyRevenueChart = new Chart(document.getElementById('monthlyRevenueChart'), {
            type:'bar', data:{labels:monthNames.map(m=>m.slice(0,3)), datasets:[{label:'Revenue', data:cData, backgroundColor:'#667eea'}]},
            options:{responsive:true, maintainAspectRatio:false}
        });
    }

    // App Initialization
    async function drawTable() {
        const bs = await db.getAll();
        const cF = document.getElementById('filterClientName').value.toLowerCase();
        const pF = document.getElementById('filterPitch').value;
        const mF = document.getElementById('filterMonth').value;
        const yF = document.getElementById('filterYear').value;
        const filtered = bs.filter(b => {
            const d = new Date(b.date);
            return (!cF || b.clientName.toLowerCase().includes(cF)) && (!pF || b.pitch === pF) && (!mF || d.getMonth()==mF) && (!yF || d.getFullYear()==yF);
        });
        document.getElementById('bookingsTableBody').innerHTML = filtered.map(b=>`<tr><td>${b.pitch}</td><td>${b.clientName}</td><td>${b.date}</td><td>${b.startTime}</td><td>${b.endTime}</td><td>AED ${b.totalPayment.toFixed(2)}</td><td><button class="btn" style="background:#dc3545; padding:5px 10px;" onclick="window.del('${b.id}')">Delete</button></td></tr>`).join('');
    }

    window.del = async (id) => { if(confirm("Delete?")) { await db.delete(id); location.reload(); }};
    document.getElementById('addBookingButton').onclick = async () => {
        const data = { pitch: document.getElementById('pitch').value, clientName: document.getElementById('clientName').value, contact: document.getElementById('contact').value, date: document.getElementById('bookingDate').value, startTime: document.getElementById('startTime').value, endTime: document.getElementById('endTime').value, pricePerHour: parseFloat(document.getElementById('pricePerHour').value) };
        await db.add(data); location.reload();
    };

    document.getElementById('loginButton').onclick = () => {
        if(document.getElementById('username').value==="EPsports2025" && document.getElementById('password').value==="EPsport@25") { localStorage.setItem('isLoggedIn','true'); location.reload(); }
        else document.getElementById('login-error').style.display='block';
    };

    if(localStorage.getItem('isLoggedIn')==='true') {
        document.getElementById('login-screen').style.display='none';
        document.getElementById('app-wrapper').style.display='block';
        document.getElementById('filterMonth').innerHTML = '<option value="">All</option>' + monthNames.map((m,i)=>`<option value="${i}">${m}</option>`).join('');
        document.getElementById('filterYear').innerHTML = '<option value="">All</option><option>2025</option><option>2026</option>';
        drawTable(); updateDashboard();
    }

    document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
        document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
        document.querySelectorAll('.tab').forEach(tb => tb.classList.remove('active'));
        document.getElementById(t.dataset.tab + '-content').style.display = 'block';
        t.classList.add('active');
        if(t.dataset.tab === 'dashboard') updateDashboard();
    });

    ['filterClientName','filterPitch','filterMonth','filterYear'].forEach(id => document.getElementById(id).onchange = drawTable);
    ['yearFilter','pitchRevenueMonthFilter','pitchRevenueYearFilter','repeatClientMonthFilter','repeatClientYearFilter'].forEach(id => document.getElementById(id).onchange = updateDashboard);
    document.getElementById('exportButton').onclick = exportToExcel;
    document.getElementById('clearFiltersButton').onclick = clearBookingFilters;
    document.getElementById('signOutButton').onclick = () => { localStorage.removeItem('isLoggedIn'); location.reload(); };
    document.getElementById('closeReportModal').onclick = () => document.getElementById('report-modal-overlay').style.display = 'none';
});
</script>
</body>
</html>
