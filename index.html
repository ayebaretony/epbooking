<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Pitch Booking System</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <script src="firebase-config.js"></script>
    
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height:100vh; padding:20px; }
        .container { max-width:1400px; margin:0 auto; background:white; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,0.1); overflow:hidden; }
        .header { background:linear-gradient(135deg, #2c3e50, #34495e); color:white; padding:30px; text-align:center; position:relative; }
        .header h1 { font-size:2.5em; margin-bottom:10px; }
        .header-btn { background:rgba(255,255,255,0.2); border:2px solid rgba(255,255,255,0.3); color:white; padding:10px 20px; border-radius:25px; cursor:pointer; font-size:14px; font-weight:600; transition: 0.3s; }
        .header-btn:hover { background:rgba(255,255,255,0.4); }
        .export-btn { position:absolute; top:20px; right:20px; }
        .import-btn { position:absolute; top:20px; right:150px; }
        .report-btn { position:absolute; top:70px; right:20px; background: #28a745 !important; }
        .signout-btn { position:absolute; top:20px; left:20px; background:#dc3545 !important; }
        
        .tabs { display:flex; background:#f8f9fa; border-bottom:3px solid #e9ecef; }
        .tab { flex:1; padding:20px; text-align:center; background:#e9ecef; cursor:pointer; font-weight:bold; transition: 0.3s; }
        .tab.active { background:white; color:#2c3e50; border-top: 4px solid #667eea; }
        
        .content { padding:30px; }
        .booking-form, .filter-bar { background:#f8f9fa; padding:20px; border-radius:15px; margin-bottom:30px; }
        .form-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:20px; margin-bottom:20px; }
        .form-group { display:flex; flex-direction:column; }
        .form-group label { font-weight:600; margin-bottom:8px; }
        .form-group input, .form-group select { padding:12px; border:2px solid #e9ecef; border-radius:10px; }
        
        .btn { padding:12px 20px; background:linear-gradient(135deg, #667eea, #764ba2); color:white; border:none; border-radius:25px; cursor:pointer; font-weight:600; }
        .booking-table { margin-top:20px; border-radius:15px; overflow-x:auto; }
        .booking-table table { width:100%; border-collapse:collapse; }
        .booking-table th { background:#34495e; color:white; padding:15px; text-align: left; }
        .booking-table td { padding:12px; border-bottom:1px solid #eee; }
        
        .dashboard-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:20px; }
        .dashboard-card { background:#f9f9f9; padding:20px; border-radius:15px; border: 1px solid #eee; }
        .metric { background:#667eea; color:white; border-radius:10px; padding:15px; text-align:center; margin-top: 10px; }
        .metric-value { font-size:2em; font-weight:bold; }
        
        #calendarGrid { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
        .calendar-day { background:#fff; border:1px solid #ddd; border-radius:10px; padding:8px; min-height:110px; }
        .calendar-event { font-size: 0.75em; background: #eef2ff; padding: 2px 5px; border-radius: 4px; margin-top: 2px; border-left: 3px solid #667eea; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #login-screen, #report-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 3000; }
        .login-box, .modal-box { background: white; padding: 40px; border-radius: 20px; width: 100%; max-width: 450px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2 style="text-align:center; margin-bottom:20px;">⚽ Palace Sports Login</h2>
            <div class="form-group"><label>Username</label><input id="username" type="text"></div><br>
            <div class="form-group"><label>Password</label><input id="password" type="password"></div><br>
            <button id="loginButton" class="btn" style="width: 100%;">Login</button>
            <p id="login-error" style="color: #dc3545; margin-top: 15px; text-align:center; display: none;">Invalid credentials.</p>
        </div>
    </div>

    <div id="report-modal-overlay">
        <div class="modal-box">
            <h2 style="text-align:center; margin-bottom:20px;">📄 AI Performance Report</h2>
            <div class="form-group">
                <label>Select Year</label>
                <select id="reportYearSelect"></select>
            </div>
            <div class="form-row" style="margin-top:15px;">
                <div class="form-group"><label>From</label><select id="reportStartMonth"></select></div>
                <div class="form-group"><label>To</label><select id="reportEndMonth"></select></div>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 25px;">
                <button id="generateFinalReport" class="btn" style="flex: 1; background: #28a745;">Download PDF</button>
                <button id="closeReportModal" class="btn" style="flex: 1; background: #6c757d;">Cancel</button>
            </div>
        </div>
    </div>

    <div id="app-wrapper" style="display:none;">
        <div class="container">
            <div class="header">
                <button id="signOutButton" class="header-btn signout-btn">Sign Out</button>
                <h1>⚽ Football Pitch Booking System</h1>
                <button id="importButton" class="header-btn import-btn">📥 Import</button>
                <button id="exportButton" class="header-btn export-btn">📊 Export</button>
                <button id="reportButton" class="header-btn report-btn">📄 AI Report</button>
            </div>

            <div class="tabs">
                <div class="tab active" data-tab="bookings">📋 Bookings</div>
                <div class="tab" data-tab="dashboard">📊 Dashboard</div>
                <div class="tab" data-tab="calendar">📅 Calendar</div>
            </div>

            <div class="content">
                <div id="bookings-content" class="tab-content">
                    <form id="bookingForm" class="booking-form">
                        <div class="form-row">
                            <div class="form-group"><label>Pitch</label><select id="pitch"><option>Fifa Pitch</option><option>Junior Football Pitch</option><option>Airdome</option><option>Half Pitch</option></select></div>
                            <div class="form-group"><label>Client Name</label><input id="clientName"></div>
                            <div class="form-group"><label>Contact</label><input id="contact"></div>
                        </div>
                        <div class="form-row
