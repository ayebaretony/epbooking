<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palace Sports</title>
    <!-- Open the connections the app will need now, while the code is still downloading, so the first sign-in check and the
         first database call don't each pay for a new connection. -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <!-- Inter, the typeface used in the designs. The stylesheet loads WITHOUT blocking the page (the text shows in a plain font
         first and switches when Inter arrives), instead of making the whole page wait for another website. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>
    <!-- Shown the instant the page arrives, until the app's code takes over, so people never stare at a blank page. -->
    <style>
      body { margin: 0; background: #f8fcf7; }
      #boot { display: flex; min-height: 100vh; align-items: center; justify-content: center; }
      #boot span { width: 28px; height: 28px; border: 3px solid #dbe6da; border-top-color: #245521; border-radius: 50%; animation: boot-spin 0.8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot" role="status" aria-label="Loading"><span></span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
