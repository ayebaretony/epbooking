<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palace Sports has moved</title>
    <meta name="robots" content="noindex" />
    <!-- Sends people to the new site after a few seconds. The link below is there for anyone who is not redirected. -->
    <meta http-equiv="refresh" content="6; url=https://pitchbookingsystem-6e222.web.app/" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: #f8fcf7;
        color: #121a14;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 26rem;
        padding: 32px 28px;
        text-align: center;
        background: #ffffff;
        border: 1px solid #dce5da;
        border-radius: 16px;
        box-shadow: 0 1px 2px rgba(18, 26, 20, 0.05);
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        background: #245521;
        color: #ffffff;
        font-size: 18px;
        font-weight: 700;
      }
      h1 { margin: 0 0 8px; font-size: 1.35rem; }
      p { margin: 0 0 12px; color: #5d6a60; line-height: 1.5; font-size: 0.95rem; }
      a.button {
        display: inline-block;
        margin-top: 8px;
        padding: 12px 20px;
        border-radius: 10px;
        background: #245521;
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
      }
      a.button:hover, a.button:focus-visible { background: #1b4219; }
      a.button:focus-visible { outline: 2px solid #245521; outline-offset: 2px; }
      small { display: block; margin-top: 16px; color: #5d6a60; font-size: 0.8rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">PS</div>
      <h1>Palace Sports has moved</h1>
      <p>The booking system now lives at a new address and has a new sign-in. You will be taken there in a few seconds.</p>
      <a class="button" href="https://pitchbookingsystem-6e222.web.app/">Open the new site</a>
      <small>Please update any bookmark. If you cannot sign in, ask the owner for access.</small>
    </main>
  </body>
</html>
